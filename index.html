<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiteSizR - Atmospheric Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00288e;
            --primary-container: #1e40af;
            --secondary: #006689;
            --secondary-container: #5bcaff;
            --surface: #f9f9ff;
            --surface-container-low: #f1f3ff;
            --surface-container: #e8eaf6;
            --surface-container-high: #e0e8ff;
            --surface-container-highest: #dbe2f9;
            --surface-bright: #ffffff;
            --on-surface: #141b2c;
            --on-surface-variant: #444653;
            --outline: #757684;
            --outline-variant: #c4c5d5;
            --on-primary: #ffffff;
            --warning: #f59e0b;
            --danger: #ef4444;
            --surface-tint: #3755c3;
            --secondary-fixed: #c3e8ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            color: var(--on-surface);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--surface);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            background: var(--surface-container-high);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .lang-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--outline);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--surface-bright);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 40, 142, 0.1);
        }

        /* Hero Card - Glassmorphism */
        .hero-card {
            margin: 0 20px 20px;
            border-radius: 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-container) 100%);
            padding: 28px;
            color: var(--on-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(20, 27, 44, 0.15);
        }

        .hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            max-width: 70%;
        }

        .location-badge:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .location-icon {
            font-size: 16px;
        }

        .location-text {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            color: white;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .refresh-btn.spinning .material-symbols-outlined {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Wind Display */
        .wind-display {
            text-align: center;
            margin-bottom: 24px;
        }

        .wind-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .wind-value-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .wind-value {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
        }

        .wind-unit {
            font-size: 20px;
            font-weight: 600;
            opacity: 0.8;
        }

        .gusts-text {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .manual-wind-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Kite Size Display - Asymmetric */
        .kite-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .kite-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 12px;
        }

        .kite-value-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
        }

        .kite-value {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
        }

        .kite-unit-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .kite-unit {
            font-size: 24px;
            font-weight: 700;
        }

        .kite-type-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }

        .wind-warning {
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }

        .wind-warning.too-little {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .wind-warning.too-much {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Hero Footer */
        .hero-footer {
            display: flex;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-stat {
            text-align: center;
        }

        .footer-stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
            margin-bottom: 4px;
        }

        .footer-stat-value {
            font-size: 16px;
            font-weight: 700;
        }

        .direction-arrow {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        /* Controls Card */
        .controls-card {
            background: var(--surface-container-low);
            border-radius: 24px;
            padding: 24px;
            margin: 0 20px 20px;
        }

        .slider-section {
            margin-bottom: 28px;
        }

        .slider-section:last-child {
            margin-bottom: 0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .slider-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slider-value-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .slider-value {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .slider-unit {
            font-size: 12px;
            font-weight: 700;
            color: var(--outline);
        }

        /* Custom Slider */
        .slider-container {
            position: relative;
            height: 48px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            position: absolute;
            left: 0;
            right: 0;
            height: 12px;
            background: var(--surface-container-high);
            border-radius: 6px;
            overflow: hidden;
        }

        .slider-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary) 0%, var(--secondary-container) 100%);
            border-radius: 6px;
            transition: width 0.1s;
        }

        .slider-thumb {
            position: absolute;
            width: 28px;
            height: 28px;
            background: var(--primary);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 0 4px var(--secondary-fixed), 0 4px 12px rgba(0, 40, 142, 0.3);
            transform: translateX(-50%);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .slider-thumb:active {
            cursor: grabbing;
            transform: translateX(-50%) scale(1.1);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }

        .slider-minmax {
            font-size: 11px;
            font-weight: 600;
            color: var(--outline);
        }

        /* Kite Type Toggle */
        .kite-type-container {
            margin-top: 8px;
        }

        .kite-type-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .kite-type-toggle {
            display: flex;
            gap: 8px;
        }

        .kite-type-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-container-high);
            color: var(--on-surface-variant);
            white-space: nowrap;
        }

        .kite-type-btn.active {
            background: var(--primary);
            color: var(--on-primary);
        }

        /* GPS Button */
        .gps-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-container) 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 18px;
            margin: 0 20px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 102, 137, 0.25);
            transition: all 0.2s;
        }

        .gps-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 102, 137, 0.35);
        }

        .gps-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Spots Button */
        .spots-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-container);
            border-radius: 20px;
            padding: 18px 20px;
            margin: 0 20px 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .spots-button:hover {
            background: var(--surface-container-high);
        }

        .spots-button-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spots-icon {
            font-size: 24px;
        }

        .spots-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .spots-arrow {
            font-size: 20px;
            color: var(--outline);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface-bright);
            border-radius: 32px 32px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .modal-close {
            background: var(--surface-container-low);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Spots List */
        .spots-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .spot-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface-container-low);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .spot-item:hover {
            background: var(--surface-container);
        }

        .spot-number {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
        }

        .spot-info {
            flex: 1;
        }

        .spot-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .spot-coords {
            font-size: 12px;
            color: var(--outline);
        }

        .spot-arrow {
            color: var(--outline);
        }

        .add-spot-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .input {
            width: 100%;
            padding: 16px;
            background: var(--surface-container-low);
            border: 2px solid transparent;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--on-surface);
            outline: none;
            transition: all 0.2s;
        }

        .input:focus {
            border-color: var(--primary);
            background: var(--surface-bright);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .input-group {
            flex: 1;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-secondary {
            flex: 1;
            padding: 16px;
            background: var(--surface-container-low);
            border: none;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--outline);
            cursor: pointer;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }

        /* Map Container */
        .map-container {
            height: 200px;
            background: var(--surface-container);
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--outline);
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .map-placeholder {
            text-align: center;
        }

        .map-instruction {
            font-size: 12px;
            margin-top: 8px;
        }

        /* Manual Wind Modal */
        .wind-input-row {
            display: flex;
            gap: 12px;
        }

        .wind-input-row .input-group {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .hero-card {
                margin: 0 16px 16px;
                padding: 20px;
            }

            .kite-value {
                font-size: 56px;
            }

            .wind-value {
                font-size: 48px;
            }
        }

        /* Loading State */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        /* Error Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--on-surface);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Header action buttons */
        .hero-actions {
            display: flex;
            gap: 8px;
        }

        /* Slider: keyboard focus + no page scroll while dragging */
        .slider-container {
            touch-action: none;
            outline: none;
        }

        .slider-container:focus-visible .slider-thumb {
            box-shadow: 0 0 0 4px var(--secondary-fixed), 0 0 0 7px var(--primary);
        }

        /* Spot list actions */
        .spot-main {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .spot-name {
            overflow-wrap: anywhere;
        }

        .spot-action {
            background: none;
            border: none;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--outline);
            display: flex;
        }

        .spot-action:hover {
            background: var(--surface-container-high);
            color: var(--primary);
        }

        .spot-action.delete:hover {
            color: var(--danger);
        }

        .spots-empty {
            text-align: center;
            color: var(--outline);
            font-size: 14px;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <span class="logo-icon">🪁</span>
                <span class="logo-text">KiteSizR</span>
            </div>
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="hu">HU</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </header>

        <!-- Hero Card -->
        <div class="hero-card">
            <div class="hero-header">
                <div class="location-badge" id="locationBadge" role="button" tabindex="0">
                    <span class="location-icon">📍</span>
                    <span class="location-text" id="locationText">Válassz helyszínt</span>
                </div>
                <div class="hero-actions">
                    <button class="refresh-btn" id="manualWindBtn" data-i18n-title="manualWindTitle" data-i18n-aria="manualWindTitle">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                    <button class="refresh-btn" id="refreshBtn" data-i18n-title="refresh" data-i18n-aria="refresh">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
            </div>

            <div class="wind-display">
                <div class="wind-label" data-i18n="currentWind">Aktuális szél</div>
                <div class="wind-value-row">
                    <span class="wind-value" id="windValue">--</span>
                    <span class="wind-unit" data-i18n="knots">csomó</span>
                </div>
                <div class="gusts-text" id="gustsText" style="display: none;"></div>
            </div>

            <div class="kite-display" id="kiteDisplay">
                <div class="kite-label" data-i18n="recommendedKite">Ajánlott ernyő</div>
                <div class="kite-value-row" id="kiteValueRow">
                    <span class="kite-value" id="kiteValue">--</span>
                    <div class="kite-unit-col">
                        <span class="kite-unit">m²</span>
                        <span class="kite-type-badge" id="kiteTypeBadge">LEI</span>
                    </div>
                </div>
                <div class="wind-warning too-little" id="windWarning" style="display: none;"></div>
            </div>

            <div class="hero-footer">
                <div class="footer-stat">
                    <div class="footer-stat-label" data-i18n="direction">Irány</div>
                    <div class="direction-arrow" id="directionArrow">--</div>
                    <div class="footer-stat-value" id="directionValue">--°</div>
                </div>
                <div class="footer-stat">
                    <div class="footer-stat-label" data-i18n="source">Forrás</div>
                    <div class="footer-stat-value" id="sourceValue">--</div>
                </div>
            </div>
        </div>

        <!-- GPS Button -->
        <button class="gps-button" id="gpsButton">
            <span class="material-symbols-outlined">my_location</span>

    <script>
        // Translations
        const translations = {

                longitude: 'Hosszúság',
                cancel: 'Mégse',

                manageSpots: 'Helyszínek kezelése',
                noSpots: 'Még nincs helyszín. Adj hozzá egyet lent!',

                ridingStyle: 'Vezetési stílus',
                lei: 'LEI',
                foil: 'Fólia',
                pro: 'Profi',

                toastInvalidCoords: 'Érvénytelen koordináták',
                toastSpotAdded: 'Helyszín hozzáadva',
                toastSpotUpdated: 'Helyszín frissítve',
                toastSpotDeleted: 'Helyszín törölve',
                toastInvalidWind: 'Adj meg érvényes szélsebességet',
                toastWindUpdated: 'Szél beállítva',
                toastSelectSpotFirst: 'Előbb válassz helyszínt',
                confirmDelete: 'Törlöd: „{name}”?'
            }
        };

        // ---------------------------------------------------------------
        // Kite size algorithm (pure function, no DOM access)
        // m² = (weight / wind) × base factor × weight correction × wind correction
        // ---------------------------------------------------------------
        const KITE_FACTORS = {
            LEI: {
                PRO: 2.4,       // Experienced riders, efficient technique
                AVERAGE: 2.3,   // Standard all-around riding
                BEGINNER: 2.2,  // Beginners need more power, larger board
                SURF: 2.0,      // Wave riding, directional board
                HYDROFOIL: 1.5  // Foil board - very efficient
            },
            // Foil (soft) kites: similar sizes, slightly more efficient
            FOIL: {
                PRO: 2.2,
                AVERAGE: 2.1,
                BEGINNER: 2.0,
                SURF: 1.9,
                HYDROFOIL: 1.7
            }
        };

        const MIN_WIND = 5;     // knots, below this: too little wind
        const MAX_WIND = 45;    // knots, above this: too much wind
        const MIN_KITE = 3;     // m², smallest production kites
        const MAX_KITE = 21;    // m², largest production LEI kites

        const lerp = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));

        // Continuous wind correction (no jumps between wind ranges).
        // Light wind (8 → 14 kt): modern kites are efficient, up to 8% smaller.
        // Strong wind (25 → 35 kt): safety margin, up to 5% smaller.
        // Every segment keeps the result strictly decreasing as wind rises.
        function windCorrection(wind) {
            if (wind < 14) return lerp(0.92, 1.0, (wind - 8) / 6);
            if (wind > 25) return lerp(1.0, 0.95, (wind - 25) / 10);
            return 1.0;
        }

        // Returns { status: 'ok', size, rawSize } or { status: 'tooLittle' | 'tooMuch' }
        function calcKiteSize({ weight, wind, kiteType, ridingStyle }) {
            if (!(wind >= MIN_WIND)) return { status: 'tooLittle' };
            if (wind > MAX_WIND) return { status: 'tooMuch' };

            const factors = KITE_FACTORS[kiteType] || KITE_FACTORS.LEI;
            const baseFactor = factors[ridingStyle] || factors.AVERAGE;

            // Reference weight is 75kg: ±3% per 10kg difference
            const weightCorrection = 1 + (weight - 75) / 300;

            const rawSize = (weight / wind) * baseFactor * weightCorrection * windCorrection(wind);

            if (rawSize > MAX_KITE) return { status: 'tooLittle' };
            if (rawSize < MIN_KITE) return { status: 'tooMuch' };

            // Small kites (<7m): 0.5m steps, larger kites: whole numbers
            const size = rawSize < 7 ? Math.round(rawSize * 2) / 2 : Math.round(rawSize);
            return { status: 'ok', size: Math.max(MIN_KITE, Math.min(MAX_KITE, size)), rawSize };
        }

        // ---------------------------------------------------------------
        // Storage helpers (localStorage may be unavailable, e.g. private mode)
        // ---------------------------------------------------------------
        const STORAGE_SPOTS = 'kitesizr_spots';
        const STORAGE_SETTINGS = 'kitesizr_settings';

        function readStorage(key) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function writeStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                // Ignore: app keeps working without persistence
            }
        }

        // Default spots
        const defaultSpots = [
            { id: '1', name: 'Balatonszárszó', latitude: 46.8234, longitude: 17.8234 },
            { id: '2', name: 'Siófok Sóstó', latitude: 46.9012, longitude: 18.0567 },
            { id: '3', name: 'Agárd', latitude: 47.1234, longitude: 18.5678 },
            { id: '4', name: 'Fonyód', latitude: 46.7345, longitude: 17.5678 },
            { id: '5', name: 'Fenyves', latitude: 46.6789, longitude: 17.4567 },
        ];

        const WEIGHT_RANGE = { min: 30, max: 120 };
        const WIND_RANGE = { min: 0, max: 50 };

        // State
        let state = {
            lang: 'hu',
            weight: 75,
            windSpeed: 15,
            kiteType: 'LEI',        // LEI or FOIL
            ridingStyle: 'AVERAGE', // PRO, AVERAGE, BEGINNER, SURF, HYDROFOIL
            selectedSpot: null,
            spots: [...defaultSpots],
            windData: null,
            isLoading: false,
            isManualWind: false,
            editingSpotId: null
        };

        // DOM Elements
        const elements = {
            langBtns: document.querySelectorAll('.lang-btn'),
            locationBadge: document.getElementById('locationBadge'),
            locationText: document.getElementById('locationText'),
            refreshBtn: document.getElementById('refreshBtn'),
            manualWindBtn: document.getElementById('manualWindBtn'),
            windValue: document.getElementById('windValue'),
            gustsText: document.getElementById('gustsText'),
            kiteValue: document.getElementById('kiteValue'),
            kiteTypeBadge: document.getElementById('kiteTypeBadge'),
            kiteValueRow: document.getElementById('kiteValueRow'),
            windWarning: document.getElementById('windWarning'),
            directionArrow: document.getElementById('directionArrow'),
            directionValue: document.getElementById('directionValue'),
            sourceValue: document.getElementById('sourceValue'),
            gpsButton: document.getElementById('gpsButton'),
            weightValue: document.getElementById('weightValue'),
            weightSlider: document.getElementById('weightSlider'),
            windSliderValue: document.getElementById('windSliderValue'),
            windSlider: document.getElementById('windSlider'),
            kiteTypeBtns: document.querySelectorAll('#kiteTypeToggle .kite-type-btn'),
            ridingStyleBtns: document.querySelectorAll('.kite-type-btn[data-style]'),
            spotsButton: document.getElementById('spotsButton'),
            spotsModal: document.getElementById('spotsModal'),
            closeSpotsModal: document.getElementById('closeSpotsModal'),
            spotsList: document.getElementById('spotsList'),
            addSpotBtn: document.getElementById('addSpotBtn'),
            addSpotModal: document.getElementById('addSpotModal'),
            spotModalTitle: document.getElementById('spotModalTitle'),
            closeAddSpotModal: document.getElementById('closeAddSpotModal'),
            cancelAddSpot: document.getElementById('cancelAddSpot'),
            saveSpot: document.getElementById('saveSpot'),
            spotNameInput: document.getElementById('spotNameInput'),
            latInput: document.getElementById('latInput'),
            lonInput: document.getElementById('lonInput'),
            manualWindModal: document.getElementById('manualWindModal'),
            closeManualWindModal: document.getElementById('closeManualWindModal'),
            cancelManualWind: document.getElementById('cancelManualWind'),
            saveManualWind: document.getElementById('saveManualWind'),
            manualSpeedInput: document.getElementById('manualSpeedInput'),
            manualGustsInput: document.getElementById('manualGustsInput'),
            toast: document.getElementById('toast')
        };

        let weightSlider;
        let windSlider;

        const t = (key) => translations[state.lang][key] ?? translations.en[key] ?? key;

        // Initialize
        function init() {
            loadSpots();
            loadSettings();
            setupEventListeners();
            applyToggleStates();
            updateUI();

            // Restore last selected spot (GPS location is not persisted)
            const settings = readStorage(STORAGE_SETTINGS);
            const lastSpot = settings && state.spots.find(s => s.id === settings.selectedSpotId);
            if (lastSpot) selectSpot(lastSpot);
        }

        // Load spots from localStorage
        function loadSpots() {
            const saved = readStorage(STORAGE_SPOTS);
            if (Array.isArray(saved)) {
                state.spots = saved.filter(s =>
                    s && typeof s.name === 'string' &&
                    Number.isFinite(s.latitude) && Number.isFinite(s.longitude)
                );
            }
        }

        function saveSpots() {
            writeStorage(STORAGE_SPOTS, state.spots);
        }

        // Load user settings (language, weight, kite type, style)
        function loadSettings() {
            const s = readStorage(STORAGE_SETTINGS);
            if (!s) return;
            if (translations[s.lang]) state.lang = s.lang;
            if (Number.isFinite(s.weight)) {
                state.weight = Math.max(WEIGHT_RANGE.min, Math.min(WEIGHT_RANGE.max, Math.round(s.weight)));
            }
            if (KITE_FACTORS[s.kiteType]) state.kiteType = s.kiteType;
            if (KITE_FACTORS.LEI[s.ridingStyle]) state.ridingStyle = s.ridingStyle;
        }

        function saveSettings() {
            writeStorage(STORAGE_SETTINGS, {
                lang: state.lang,
                weight: state.weight,
                kiteType: state.kiteType,
                ridingStyle: state.ridingStyle,
                selectedSpotId: state.selectedSpot && state.selectedSpot.id !== 'gps' ? state.selectedSpot.id : null
            });
        }

        // Sync toggle buttons with state
        function applyToggleStates() {
            elements.langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
            elements.kiteTypeBtns.forEach(b => b.classList.toggle('active', b.dataset.kite === state.kiteType));
            elements.ridingStyleBtns.forEach(b => b.classList.toggle('active', b.dataset.style === state.ridingStyle));
        }

        // Make role="button" divs keyboard-activatable
        function onActivate(el, handler) {
            el.addEventListener('click', handler);
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handler();
                }
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Language toggle
            elements.langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    state.lang = btn.dataset.lang;
                    applyToggleStates();
                    updateUI();
                    saveSettings();
                });
            });

            // Weight slider
            weightSlider = setupSlider(elements.weightSlider, WEIGHT_RANGE.min, WEIGHT_RANGE.max, state.weight, (val) => {
                state.weight = val;
                elements.weightValue.textContent = val;
                calculateKiteSize();
                saveSettings();
            });
            elements.weightValue.textContent = state.weight;

            // Wind slider
            windSlider = setupSlider(elements.windSlider, WIND_RANGE.min, WIND_RANGE.max, state.windSpeed, (val) => {
                state.windSpeed = val;
                state.isManualWind = true; // Mark as manual when slider is used
                state.windData = null; // Clear API data
                elements.windSliderValue.textContent = val;
                elements.locationText.textContent = t('manual');
                updateWindDisplay();
                calculateKiteSize();
            });

            // Kite type
            elements.kiteTypeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    state.kiteType = btn.dataset.kite;
                    applyToggleStates();
                    calculateKiteSize();
                    saveSettings();
                });
            });

            // Riding style
            elements.ridingStyleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    state.ridingStyle = btn.dataset.style;
                    applyToggleStates();
                    calculateKiteSize();
                    saveSettings();
                });
            });

            const openSpots = () => {
                renderSpotsList();
                openModal(elements.spotsModal);
            };
            onActivate(elements.locationBadge, openSpots);
            onActivate(elements.spotsButton, openSpots);

            // Refresh button
            elements.refreshBtn.addEventListener('click', () => {
                if (state.selectedSpot) {
                    fetchWindData(state.selectedSpot);
                } else {
                    showToast(t('toastSelectSpotFirst'));
                }
            });

            // Manual wind button
            elements.manualWindBtn.addEventListener('click', () => {
                elements.manualSpeedInput.value = state.windSpeed;
                elements.manualGustsInput.value = state.windData && state.windData.gusts > state.windSpeed ? state.windData.gusts : '';
                openModal(elements.manualWindModal);
                elements.manualSpeedInput.focus();
            });

            // GPS button
            elements.gpsButton.addEventListener('click', getGPSLocation);

            // Modals
            elements.closeSpotsModal.addEventListener('click', () => closeModal(elements.spotsModal));
            elements.closeAddSpotModal.addEventListener('click', () => closeModal(elements.addSpotModal));
            elements.closeManualWindModal.addEventListener('click', () => closeModal(elements.manualWindModal));
            elements.cancelAddSpot.addEventListener('click', () => closeModal(elements.addSpotModal));
            elements.cancelManualWind.addEventListener('click', () => closeModal(elements.manualWindModal));

            elements.addSpotBtn.addEventListener('click', () => openSpotEditor(null));

            elements.saveSpot.addEventListener('click', saveSpotFromForm);
            elements.saveManualWind.addEventListener('click', setManualWind);

            // Enter submits the forms
            [elements.spotNameInput, elements.latInput, elements.lonInput].forEach(input => {
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveSpotFromForm(); });
            });
            [elements.manualSpeedInput, elements.manualGustsInput].forEach(input => {
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') setManualWind(); });
            });

            // Close modals on overlay click / Escape
            const modals = [elements.spotsModal, elements.addSpotModal, elements.manualWindModal];
            modals.forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal(modal);
                });
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') modals.forEach(m => m.classList.contains('active') && closeModal(m));
            });
        }

        // Setup custom slider (mouse, touch and keyboard).
        // Returns { setValue } to move the slider without firing the callback.
        function setupSlider(container, min, max, initial, callback) {
            const track = container.querySelector('.slider-track');
            const fill = container.querySelector('.slider-fill');
            const thumb = container.querySelector('.slider-thumb');

            let isDragging = false;
            let current = initial;

            container.setAttribute('aria-valuemin', min);
            container.setAttribute('aria-valuemax', max);

            function render(value) {
                const percent = Math.max(0, Math.min(1, (value - min) / (max - min)));
                fill.style.width = `${percent * 100}%`;
                thumb.style.left = `${percent * 100}%`;
                container.setAttribute('aria-valuenow', value);
            }

            function setFromUser(value) {
                value = Math.max(min, Math.min(max, Math.round(value)));
                render(value);
                if (value !== current) {
                    current = value;
                    callback(value);
                }
            }

            function updateFromPointer(clientX) {
                const rect = track.getBoundingClientRect();
                const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                setFromUser(min + percent * (max - min));
            }

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                e.preventDefault();
                container.focus();
                updateFromPointer(e.clientX);
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) updateFromPointer(e.clientX);
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Touch events (passive: false so the page does not scroll while dragging)
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                e.preventDefault();
                updateFromPointer(e.touches[0].clientX);
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    updateFromPointer(e.touches[0].clientX);
                }
            }, { passive: false });

            document.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Keyboard
            container.addEventListener('keydown', (e) => {
                const steps = {
                    ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 5, PageDown: -5
                };
                if (e.key in steps) {
                    setFromUser(current + steps[e.key]);
                } else if (e.key === 'Home') {
                    setFromUser(min);
                } else if (e.key === 'End') {
                    setFromUser(max);
                } else {
                    return;
                }
                e.preventDefault();
            });

            render(initial);

            return {
                setValue(value) {
                    current = Math.round(value);
                    render(value);
                }
            };
        }

        // Fetch current wind data from Open-Meteo (knots)
        async function fetchWindData(spot) {
            if (state.isLoading) return;

            state.isLoading = true;
            elements.refreshBtn.classList.add('spinning');
            elements.windValue.textContent = '...';

            try {
                const params = new URLSearchParams({
                    latitude: spot.latitude.toString(),
                    longitude: spot.longitude.toString(),
                    current: 'wind_speed_10m,wind_gusts_10m,wind_direction_10m',
                    wind_speed_unit: 'kn',
                    timezone: 'auto'
                });

                const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
                if (!response.ok) throw new Error(`API error ${response.status}`);

                const data = await response.json();
                const current = data.current;
                if (!current || !Number.isFinite(current.wind_speed_10m)) throw new Error('Missing wind data');

                const speedKnots = Math.round(current.wind_speed_10m * 10) / 10;
                const gustsKnots = Number.isFinite(current.wind_gusts_10m)
                    ? Math.round(current.wind_gusts_10m * 10) / 10
                    : null;

                state.windData = {
                    speed: speedKnots,
                    gusts: gustsKnots,
                    direction: Number.isFinite(current.wind_direction_10m) ? current.wind_direction_10m : undefined,
                    timestamp: new Date(),
                    source: 'open-meteo'
                };

                state.isManualWind = false;
                state.windSpeed = speedKnots;
                elements.locationText.textContent = spot.name;

                windSlider.setValue(Math.min(WIND_RANGE.max, speedKnots));
                elements.windSliderValue.textContent = Math.round(speedKnots);

                updateWindDisplay();
                calculateKiteSize();
            } catch (error) {
                console.error('Error fetching wind:', error);
                showToast(t('toastFetchFailed'));
                updateWindDisplay();
            } finally {
                state.isLoading = false;
                elements.refreshBtn.classList.remove('spinning');
            }
        }

        // Get GPS location
        function setGpsButton(loading) {
            elements.gpsButton.disabled = loading;
            elements.gpsButton.replaceChildren();
            const icon = document.createElement('span');
            if (loading) {
                icon.className = 'loading';
            } else {
                icon.className = 'material-symbols-outlined';
                icon.textContent = 'my_location';
            }
            const label = document.createElement('span');
            label.textContent = t(loading ? 'gettingLocation' : 'useGps');
            elements.gpsButton.append(icon, label);
        }

        function getGPSLocation() {
            if (!navigator.geolocation) {
                showToast(t('toastGeoUnsupported'));
                return;
            }

            setGpsButton(true);

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const spot = {
                        id: 'gps',
                        name: t('currentLocation'),
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };
                    setGpsButton(false);
                    selectSpot(spot);
                },
                (error) => {
                    console.error('GPS error:', error);
                    showToast(t('toastLocationFailed'));
                    setGpsButton(false);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // Update wind display
        function updateWindDisplay() {
            elements.windValue.textContent = state.windSpeed.toFixed(1);

            if (state.windData) {
                if (state.windData.gusts && state.windData.gusts > state.windSpeed) {
                    elements.gustsText.textContent = `${t('gusts')}: ${state.windData.gusts.toFixed(1)} ${t('knots')}`;
                    elements.gustsText.style.display = 'block';
                } else {
                    elements.gustsText.style.display = 'none';
                }

                if (Number.isFinite(state.windData.direction)) {
                    elements.directionArrow.textContent = degreesToCompass(state.windData.direction);
                    elements.directionValue.textContent = `${Math.round(state.windData.direction)}°`;
                } else {
                    elements.directionArrow.textContent = '--';
                    elements.directionValue.textContent = '--°';
                }

                elements.sourceValue.textContent = state.windData.source === 'open-meteo' ? 'Open-Meteo' : t('manual');
            } else {
                elements.gustsText.style.display = 'none';
                elements.directionArrow.textContent = '--';
                elements.directionValue.textContent = '--°';
                elements.sourceValue.textContent = t('manual');
            }
        }

        // Render the kite size recommendation
        function calculateKiteSize() {
            const result = calcKiteSize({
                weight: state.weight,
                wind: state.windSpeed,
                kiteType: state.kiteType,
                ridingStyle: state.ridingStyle
            });

            if (result.status !== 'ok') {
                const tooLittle = result.status === 'tooLittle';
                elements.kiteValueRow.style.display = 'none';
                elements.windWarning.textContent = t(tooLittle ? 'tooLittleWind' : 'tooMuchWind');
                elements.windWarning.className = `wind-warning ${tooLittle ? 'too-little' : 'too-much'}`;
                elements.windWarning.style.display = 'block';
                return;
            }

            elements.windWarning.style.display = 'none';
            elements.kiteValueRow.style.display = 'flex';
            elements.kiteValue.textContent = result.size % 1 === 0 ? result.size.toFixed(0) : result.size.toFixed(1);
            elements.kiteTypeBadge.textContent = state.kiteType === 'FOIL' ? 'FOIL' : 'LEI';
        }

        // Degrees to compass
        function degreesToCompass(degrees) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(degrees / 45) % 8;
            return directions[index];
        }

        // Render spots list (built with DOM APIs; spot names are user input)
        function renderSpotsList() {
            elements.spotsList.replaceChildren();

            if (state.spots.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'spots-empty';
                empty.textContent = t('noSpots');
                elements.spotsList.appendChild(empty);
                return;
            }

            state.spots.forEach((spot, index) => {
                const item = document.createElement('div');
                item.className = 'spot-item';

                const main = document.createElement('div');
                main.className = 'spot-main';
                main.setAttribute('role', 'button');
                main.tabIndex = 0;

                const number = document.createElement('div');
                number.className = 'spot-number';
                number.textContent = index + 1;

                const info = document.createElement('div');
                info.className = 'spot-info';
                const name = document.createElement('div');
                name.className = 'spot-name';
                name.textContent = spot.name;
                const coords = document.createElement('div');
                coords.className = 'spot-coords';
                coords.textContent = `${spot.latitude.toFixed(4)}, ${spot.longitude.toFixed(4)}`;
                info.append(name, coords);
                main.append(number, info);
                onActivate(main, () => {
                    closeModal(elements.spotsModal);
                    selectSpot(spot);
                });

                const editBtn = createIconButton('edit', t('edit'), 'spot-action', () => openSpotEditor(spot));
                const deleteBtn = createIconButton('delete', t('delete'), 'spot-action delete', () => deleteSpot(spot));

                item.append(main, editBtn, deleteBtn);
                elements.spotsList.appendChild(item);
            });
        }

        function createIconButton(icon, label, className, handler) {
            const btn = document.createElement('button');
            btn.className = className;
            btn.title = label;
            btn.setAttribute('aria-label', label);
            const span = document.createElement('span');
            span.className = 'material-symbols-outlined';
            span.textContent = icon;
            btn.appendChild(span);
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                handler();
            });
            return btn;
        }

        // Select spot
        function selectSpot(spot) {
            state.selectedSpot = spot;
            state.isManualWind = false;
            elements.locationText.textContent = spot.name;
            saveSettings();
            fetchWindData(spot);
        }

        // Open add/edit spot modal (spot = null → new spot)
        function openSpotEditor(spot) {
            state.editingSpotId = spot ? spot.id : null;
            elements.spotModalTitle.textContent = t(spot ? 'editSpot' : 'addSpot');
            elements.spotNameInput.value = spot ? spot.name : '';
            elements.latInput.value = spot ? spot.latitude : '';
            elements.lonInput.value = spot ? spot.longitude : '';
            closeModal(elements.spotsModal);
            openModal(elements.addSpotModal);
            elements.spotNameInput.focus();
        }

        // Save new or edited spot
        function saveSpotFromForm() {
            const name = elements.spotNameInput.value.trim();
            const lat = parseFloat(elements.latInput.value);
            const lon = parseFloat(elements.lonInput.value);

            if (!name || isNaN(lat) || isNaN(lon)) {
                showToast(t('toastFillAll'));
                return;
            }
            if (Math.abs(lat) > 90 || Math.abs(lon) > 180) {
                showToast(t('toastInvalidCoords'));
                return;
            }

            let spot;
            const existing = state.editingSpotId && state.spots.find(s => s.id === state.editingSpotId);
            if (existing) {
                Object.assign(existing, { name, latitude: lat, longitude: lon });
                spot = existing;
            } else {
                spot = { id: Date.now().toString(), name, latitude: lat, longitude: lon };
                state.spots.push(spot);
            }
            saveSpots();

            closeModal(elements.addSpotModal);
            showToast(t(existing ? 'toastSpotUpdated' : 'toastSpotAdded'));
            state.editingSpotId = null;
            selectSpot(spot);
        }

        // Delete spot
        function deleteSpot(spot) {
            if (!confirm(t('confirmDelete').replace('{name}', spot.name))) return;

            state.spots = state.spots.filter(s => s.id !== spot.id);
            saveSpots();

            if (state.selectedSpot && state.selectedSpot.id === spot.id) {
                state.selectedSpot = null;
                if (!state.isManualWind) elements.locationText.textContent = t('selectSpot');
                saveSettings();
            }

            renderSpotsList();
            showToast(t('toastSpotDeleted'));
        }

        // Set manual wind
        function setManualWind() {
            const speed = parseFloat(elements.manualSpeedInput.value);
            const gusts = parseFloat(elements.manualGustsInput.value);

            if (isNaN(speed) || speed < 0 || speed > 100) {
                showToast(t('toastInvalidWind'));
                return;
            }

            state.windSpeed = speed;
            state.isManualWind = true;
            state.windData = {
                speed: speed,
                gusts: isNaN(gusts) ? null : gusts,
                direction: undefined,
                timestamp: new Date(),
                source: 'manual'
            };

            windSlider.setValue(Math.min(WIND_RANGE.max, speed));
            elements.windSliderValue.textContent = Math.round(speed);
            elements.locationText.textContent = t('manual');

            elements.manualSpeedInput.value = '';
            elements.manualGustsInput.value = '';

            closeModal(elements.manualWindModal);
            updateWindDisplay();
            calculateKiteSize();
            showToast(t('toastWindUpdated'));
        }

        // Modal helpers
        function openModal(modal) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modal) {
            modal.classList.remove('active');
            if (!document.querySelector('.modal-overlay.active')) {
                document.body.style.overflow = '';
            }
        }

        // Update all translated texts
        function updateUI() {
            document.documentElement.lang = state.lang;

            document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
            document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
            document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));

            // Edit modal title depends on mode
            elements.spotModalTitle.textContent = t(state.editingSpotId ? 'editSpot' : 'addSpot');

            if (state.isManualWind) {
                elements.locationText.textContent = t('manual');
            } else if (state.selectedSpot) {
                if (state.selectedSpot.id === 'gps') state.selectedSpot.name = t('currentLocation');
                elements.locationText.textContent = state.selectedSpot.name;
            } else {
                elements.locationText.textContent = t('selectSpot');
            }

            if (!elements.gpsButton.disabled) setGpsButton(false);
            if (elements.spotsModal.classList.contains('active')) renderSpotsList();

            updateWindDisplay();
            calculateKiteSize();
        }

        // Toast
        let toastTimer;
        function showToast(message) {
            elements.toast.textContent = message;
            elements.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                elements.toast.classList.remove('show');
            }, 3000);
        }

        // Start
        init();
    </script>
</body>
</html>
